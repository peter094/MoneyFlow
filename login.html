<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#090E17">

    <!-- If already signed in, skip straight to the app — same
         run-before-paint pattern used for the guard on the other
         pages, just in reverse. -->
    <script>
        (function () {
            try {
                if (localStorage.getItem("moneyflow_auth_token")) {
                    window.location.replace("index.html");
                }
            } catch (e) {}
        })();
    </script>

    <title>MoneyFlow | Sign In</title>

    <link rel="stylesheet" href="auth.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">

</head>

<body>

    <!-- ================= BRAND ================= -->

    <div class="auth-brand">

        <span class="auth-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 16L9.5 10.5L13.5 14.5L20 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 8H20V13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>

        <h1>Money<span>Flow</span></h1>

    </div>


    <!-- ================= CONFIG WARNING (only shows if unconfigured) ================= -->

    <div id="configWarning" class="auth-config-warning">
        auth.js still has a placeholder backend URL — sign in/up won't work until that's set to your real Render URL.
    </div>


    <!-- ================= INTRO ================= -->

    <div class="auth-intro">
        <h2 id="introHeading">Welcome</h2>
        <p id="introSubheading">Sign in or create an account to get started.</p>
    </div>


    <!-- ================= MODE TOGGLE ================= -->

    <div class="auth-mode-toggle">
        <button type="button" id="loginTabBtn" class="active">Login</button>
        <button type="button" id="registerTabBtn">Register</button>
    </div>


    <!-- ================= FORM ================= -->

    <form class="auth-form" id="authForm" novalidate>

        <div id="authError" class="auth-error" role="alert"></div>

        <div class="auth-field auth-field-register-only" id="fullNameField" hidden>
            <label for="authFullName">Full Name</label>
            <input
                type="text"
                id="authFullName"
                placeholder="Your name"
                autocomplete="name"
            >
        </div>

        <div class="auth-field">
            <label for="authEmail">Email</label>
            <input
                type="email"
                id="authEmail"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="auth-field">
            <label for="authPassword">Password</label>
            <div class="auth-field-input-wrap">
                <input
                    type="password"
                    id="authPassword"
                    data-password-field
                    placeholder="At least 8 characters"
                    autocomplete="current-password"
                    minlength="8"
                    required
                >
                <button type="button" class="auth-password-toggle" id="togglePasswordBtn" aria-label="Show password">
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="auth-field auth-field-register-only" id="confirmPasswordField" hidden>
            <label for="authConfirmPassword">Confirm Password</label>
            <input
                type="password"
                id="authConfirmPassword"
                data-password-field
                placeholder="Re-enter your password"
                autocomplete="new-password"
                minlength="8"
            >
        </div>

        <button type="submit" class="auth-submit" id="authSubmitBtn">
            <span class="auth-spinner" aria-hidden="true"></span>
            <span class="auth-submit-label" id="authSubmitLabel">Log In</span>
        </button>

    </form>


    <!-- ================= SWITCH MODE ================= -->

    <p class="auth-switch" id="authSwitchText">
        Don't have an account?
        <button type="button" id="switchToRegisterBtn">Create one</button>
    </p>


    <script src="core.js" defer></script>
    <script src="auth.js" defer></script>

</body>

</html>
