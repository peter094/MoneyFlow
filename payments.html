
<!DOCTYPE html>
<html lang="en">

<head>
  <!-- MONEYFLOW: prevent placeholder totals and empty states from flashing before JS renders. -->
  <style>
    html.mf-awaiting-render { background: #09090f !important; }
    html.mf-awaiting-render body { visibility: hidden !important; }
  </style>
  <script>
    (function () {
      const root = document.documentElement;
      root.classList.add("mf-awaiting-render");
      let released = false;
      function revealReadyPage() {
        if (released) return;
        released = true;
        requestAnimationFrame(() => root.classList.remove("mf-awaiting-render"));
      }
      // Deferred page scripts run before this event, and their render
      // listeners finish before the animation-frame reveal.
      document.addEventListener("DOMContentLoaded", revealReadyPage, { once: true });
      window.addEventListener("pageshow", revealReadyPage, { once: true });
      // Fail open if a third-party resource unexpectedly stalls.
      window.setTimeout(revealReadyPage, 3000);
    })();
  </script>

  <meta charset="UTF-8">

  <!-- LOGIN PROTECTION -->
  <script>
    (function () {
      document.documentElement.classList.add("dark");

      try {
        if (!localStorage.getItem("moneyflow_auth_token")) {
          location.replace("login.html");
        }
      } catch (error) {
        location.replace("login.html");
      }
    })();
  </script>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"

  <meta name="theme-color" content="#09090f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>MoneyFlow | Payments</title>

  <link rel="manifest" href="manifest.json">
  <link
    rel="icon"

  >

    href="icons/icon-192.png"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="payments.css">

  <!-- HEADER STYLING TO MATCH OTHER PAGES -->
  <style>
    .payments-intro {
      padding: 0;
    }

    .payments-page-header {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .payments-back {
      display: grid;
      place-items: center;
      flex: 0 0 38px;
      width: 38px;
      height: 42px;
      color: #f8f8fa;
      border-radius: 12px;
      text-decoration: none;
    }

    .payments-back svg {
      width: 25px;
      height: 25px;
    }

    .payments-page-header h1 {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      font-size: clamp(21px, 6vw, 30px);
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: 1.2;
      color: #fff;
    }

    .payments-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .payments-header-actions .payments-header-icon,
    .payments-header-actions .payments-header-avatar {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border-radius: 50%;
      padding: 0;
    }

    .payments-header-actions .notification-bell {
      background: #1b1c27;
      border: 0;
      color: #f8f8fa;
    }

    .payments-header-actions .add-fab {
      background: linear-gradient(
        135deg,
        #36d9a6,
        #149b78
      );
      border: 0;
      color: #fff;
    }

    .payments-header-actions .payments-header-avatar {
      background: #169f79;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }

    .payments-header-actions svg {
      width: 19px;
      height: 19px;
    }

    .payments-subtitle {
      margin: 9px 0 0 47px;
      font-size: 12px;
      line-height: 1.55;
      color: #9b9daa;
    }

    .payments-back:focus-visible,
    .payments-header-avatar:focus-visible {
      outline: 2px solid #42dda7;
      outline-offset: 3px;
    }

    @media (max-width: 370px) {
      .payments-page-header {
        gap: 6px;
      }

      .payments-back {
        width: 32px;
        flex-basis: 32px;
      }

      .payments-header-actions {
        gap: 4px;
      }

      .payments-header-actions .payments-header-icon,
      .payments-header-actions .payments-header-avatar {
        width: 33px;
        height: 33px;
        flex-basis: 33px;
      }

      .payments-page-header h1 {
        font-size: 21px;
      }

      .payments-subtitle {
        margin-left: 38px;
      }
    }

    .bottom-nav > a.bottom-nav-item {
      text-decoration: none;
    }
  </style>

  <link rel="prefetch" href="home.html">
  <link rel="prefetch" href="spending.html">
  <link rel="prefetch" href="debts.html">
  <link rel="prefetch" href="more.html">

  <link rel="stylesheet" href="date-picker.css">

  <link rel="stylesheet" href="receipt-actions.css">

  <script src="core.js" defer></script>
  <script src="date-picker.js" defer></script>
  <script src="payments.js" defer></script>
  <script src="notifications.js" defer></script>

</head>

<body>

  <!-- =====================================
       PAYMENTS MAIN PAGE
  ====================================== -->

  <main class="payments-page">

    <!-- PAGE HEADER -->

    <section
      class="payments-intro"
      aria-labelledby="paymentsTitle"
    >

      <header class="payments-page-header">

        <!-- BACK TO HOME -->

        <a
          href="home.html"
          class="payments-back"
          aria-label="Back to Home"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5"/>
            <path d="m12 19-7-7 7-7"/>
          </svg>
        </a>

        <h1 id="paymentsTitle">
          Payments
        </h1>

        <div class="payments-header-actions">

          <!-- NOTIFICATIONS -->

          <button
            type="button"
            id="notificationBellBtn"
            class="notification-bell payments-header-icon"
            aria-label="Payment notifications"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9Z"
              />
              <path d="M10 21h4"/>
            </svg>

            <span
              id="notificationBadge"
              class="notification-badge"
            ></span>

          </button>

          <!-- ADD PAYMENT -->

          <button
            type="button"
            id="addPaymentBtn"
            class="add-fab payments-header-icon"
            aria-label="Add payment"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.3"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>

          <!-- USER PROFILE -->

          <a
            href="settings.html"
            id="userAvatar"
            class="user-avatar payments-header-avatar"
            aria-label="Open Settings"
          >
            M
          </a>

        </div>

      </header>

      <p class="payments-subtitle">
        Stay on top of all your bills and upcoming payments.
      </p>

    </section>


    <!-- =====================================
         OUTSTANDING PAYMENTS OVERVIEW
    ====================================== -->

    <section
      class="payments-overview-section"
      aria-label="Outstanding payment summary"
    >

      <div class="payments-hero">

        <p class="payments-hero-label">
          Total Outstanding Payments
        </p>

        <h2
          class="payments-hero-amount"
          id="totalOutstanding"
        >
          ₦0.00
        </h2>

        <div class="payments-hero-pills">

          <!-- OVERDUE -->

          <span
            class="payments-pill payments-pill-danger"
          >
            <span id="overdueCount">0</span>
            Overdue
          </span>

          <!-- UPCOMING -->

          <span
            class="payments-pill payments-pill-warning"
          >
            <span id="upcomingCount">0</span>
            Upcoming
          </span>

          <!-- PAID -->

          <span
            class="payments-pill payments-pill-success"
          >
            <span id="paidCount">0</span>
            Paid
          </span>

        </div>

      </div>

    </section>


    <!-- =====================================
         ALL PAYMENTS
    ====================================== -->

    <section
      class="payments-records-section"
      aria-labelledby="allPaymentsHeading"
    >

      <div class="section-heading">

        <h2 id="allPaymentsHeading">
          All Payments
        </h2>

      </div>

      <!-- Populated by payments.js -->

      <div
        id="paymentsList"
        class="payments-list"
        aria-live="polite"
      >

        <!-- EMPTY STATE -->

        <div class="empty-state">

          <h3>No payments yet</h3>

          <p>
            Add a bill or upcoming payment
            to start tracking it here.
          </p>

          <button
            type="button"
            id="emptyAddPaymentBtn"
            class="primary-button"
          >
            Add Payment
          </button>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================
       ADD PAYMENT MODAL
  ====================================== -->

  <div
    id="paymentModal"
    class="modal"
    aria-hidden="true"
  >

    <div
      class="modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="addPaymentTitle"
    >

      <!-- MODAL HEADER -->

      <div class="modal-header">

        <div>

          <p class="eyebrow">
            NEW PAYMENT
          </p>

          <h2 id="addPaymentTitle">
            Add Payment
          </h2>

        </div>

        <button
          type="button"
          id="closePaymentModalBtn"
          class="close-button"
          aria-label="Close Add Payment"
        >
          ×
        </button>

      </div>

      <!-- PAYMENT FORM -->

      <form id="paymentForm">

        <div class="modal-body">

          <!-- PAYMENT NAME -->

          <div class="form-field form-field-full">

            <label for="paymentName">
              Name
            </label>

            <input
              type="text"
              id="paymentName"
              placeholder="e.g. Netflix"
              maxlength="60"
              autocomplete="off"
              required
            >

          </div>

          <!-- PAYMENT AMOUNT -->

          <div class="form-field">

            <label for="paymentAmount">
              Amount (₦)
            </label>

            <input
              type="number"
              id="paymentAmount"
              placeholder="Enter amount"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              required
            >

          </div>

          <!-- PAYMENT CATEGORY -->

          <div class="form-field">

            <label for="paymentCategory">
              Category
            </label>

            <select
              id="paymentCategory"
              required
            >
              <option value="Subscription">
                Subscription
              </option>

              <option value="Bills">
                Bills
              </option>

              <option value="Loan">
                Loan
              </option>

              <option value="Rent">
                Rent
              </option>

              <option value="Insurance">
                Insurance
              </option>

              <option value="Other">
                Other
              </option>
            </select>

          </div>

          <!-- PAYMENT DUE DATE -->

          <div class="form-field">

            <label for="paymentDueDate">
              Due Date
            </label>

            <input
              type="date"
              id="paymentDueDate"
              required
            >

          </div>

          <!-- PAYMENT FREQUENCY -->

          <div class="form-field">

            <label for="paymentFrequency">
              Frequency
            </label>

            <select
              id="paymentFrequency"
              required
            >
              <option value="one-time">
                One-time
              </option>

              <option value="weekly">
                Weekly
              </option>

              <option value="monthly">
                Monthly
              </option>

              <option value="yearly">
                Yearly
              </option>
            </select>

          </div>

        </div>

        <!-- FORM ACTIONS -->

        <div class="form-actions">

          <button
            type="button"
            id="cancelPaymentBtn"
            class="secondary-button"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="primary-button"
          >
            Save Payment
          </button>

        </div>

      </form>

    </div>

  </div>

        fill="none"

        <rect

          rx="1.5"
        />
      </svg>

      <span>More</span>
    </a>

  </nav>

<!-- MONEYFLOW — PAYMENTS BACK NAVIGATION -->

<script>
(function () {
  "use strict";

  /* =====================================
     MONEYFLOW — PAYMENTS BACK NAVIGATION
     Supports Home, More and Calendar
     ===================================== */

  const backButton = document.querySelector(
    ".payments-page-header .payments-back"
  );

  if (!backButton) return;

  const params = new URLSearchParams(
    window.location.search
  );

  let origin = params.get("from");

  /* Check the previous page only if
     the URL has no explicit source. */

  if (!origin && document.referrer) {
    try {
      const previous = new URL(
        document.referrer
      );

      if (
        previous.origin ===
        window.location.origin
      ) {
        if (
          previous.pathname.endsWith(
            "/calendar.html"
          )
        ) {
          origin = "calendar";

        } else if (
          previous.pathname.endsWith(
            "/more.html"
          )
        ) {
          origin = "more";
        }
      }

    } catch (error) {
      console.warn(
        "Unable to identify previous page.",
        error
      );
    }
  }

  let destination = "home.html";
  let label = "Back to Home";

  if (origin === "calendar") {
    destination = "calendar.html";
    label = "Back to Calendar";

  } else if (origin === "more") {
    destination = "more.html";
    label = "Back to More";
  }

  backButton.href = destination;

  backButton.setAttribute(
    "aria-label",
    label
  );

})();
</script>


</body>
</html>
